name: CI

on:
  push:
    # The long-lived branches are `main` and `dev`. This said `develop`, a
    # branch that has never existed in this repository, so every pull request
    # opened against `dev` merged with no CI at all while appearing to be
    # covered by it.
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# CodeQL actions/missing-workflow-permissions: an unrestricted GITHUB_TOKEN is
# write-capable by default, so a compromised action in any step could push to
# the repository. Nothing here needs more than read.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Compile contracts
        run: bun run hardhat compile

      - name: Run tests
        run: bun run hardhat test

      - name: Run solhint
        run: bunx solhint 'contracts/**/*.sol' --config .solhint.json

      - name: Check formatting
        run: bun run prettify:check

  registry:
    name: Canonical registry · drift + chain state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # This job used `npm ci`, which cannot run here: the repository moved to
      # Bun and the tracked package-lock.json is no longer in sync with
      # package.json. The install step therefore failed on every run, taking
      # both gates below down with it — a registry gate that never executes is
      # worse than none, because it reads as green history.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The generated table is a derived artifact. Hand-editing it would change
      # where the SDK sends money without touching the registry, so the gate is
      # a regenerate-and-compare rather than a review convention.
      - name: Generated splitter table matches the registry
        run: node scripts/generate-sdk-table.mjs --check

      # Chain state is the source of truth. This fails when a required chain is
      # unreachable, on purpose: "could not check" must not pass as "verified".
      - name: Registry matches live chain state
        run: node scripts/verify-registry.mjs

      # v1.3 audit P0 #3: the timelock documents claimed a 48-hour delay that
      # was never deployed, and nothing could notice. The docs now carry a
      # governance-status marker and this gate holds it to the chain — in both
      # directions, so it also fails if a timelock goes live and the docs still
      # describe direct Safe ownership.
      - name: Governance documents match on-chain ownership
        run: node scripts/verify-governance-docs.mjs
