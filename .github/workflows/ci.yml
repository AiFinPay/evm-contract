name: CI

on:
  push:
    # This said `develop`, a branch that has never existed in this repository.
    # The long-lived branch is `dev`, so every pull request opened against it
    # ran no CI at all while appearing to be covered by it.
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Keep the payment-artifact gate scheduled as a defence against workflow or
  # branch-policy drift even when no pull request is open.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# CodeQL actions/missing-workflow-permissions: an unrestricted GITHUB_TOKEN is
# write-capable by default, so a compromised action in any step could push to
# the repository. Nothing here needs more than read.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install

      - name: Compile contracts
        run: bun run hardhat compile

      - name: Run tests
        run: bun run hardhat test

      - name: Run solhint
        run: bunx solhint 'contracts/**/*.sol' --config .solhint.json

      - name: Check formatting
        run: bun run prettify:check

  registry:
    name: v1.4 deployment artifacts · fail-closed validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      # This job used `npm ci`, which cannot run here: the repository moved to
      # Bun and the tracked package-lock.json is no longer in sync with
      # package.json. The install step therefore failed on every run, taking
      # both gates below down with it — a registry gate that never executes is
      # worse than none, because it reads as green history.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The legacy v1.1-v1.3 registry was intentionally removed and cannot
      # model v1.4's splitter + TokenList + Profiles topology. Validate the
      # checked-in v1.4 records instead; live RPC verification remains a
      # release-gate operation and must never silently pass on provider errors.
      - name: Validate v1.4 deployment records and quarantine state
        run: bun run check:deployments:offline
