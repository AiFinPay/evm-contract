name: v1.2 quarantine gate once
on:
  push:
    branches: [cleanup/archive-v12-active-lane]
    paths: [.github/workflows/v12-quarantine-gate-once.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: cleanup/archive-v12-active-lane }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - run: bun run hardhat compile && bun run hardhat test && bunx solhint 'contracts/**/*.sol' --config .solhint.json && bun run prettify:check
      - name: Assert v1.2 is outside active tree
        run: |
          test ! -e contracts/B2BSplitter.sol
          test ! -e scripts/deploy-splitter-v12.ts
          test ! -e test/unit/B2BSplitter.v12.test.ts
          test -e legacy/v1.2/B2BSplitter.sol
          grep -q 'deploy-splitter-v13-production.ts' package.json
          ! grep -RIn 'getContractFactory("B2BSplitter")' test contracts scripts
      - name: Remove helper and commit evidence-preserving cleanup
        run: |
          rm .github/workflows/v12-quarantine-gate-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(evm): verify v1.2 is quarantined from active release" || exit 0
          git push origin HEAD:cleanup/archive-v12-active-lane
