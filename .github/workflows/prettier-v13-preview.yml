name: v13-prettier-preview
on:
  pull_request:
    paths:
      - 'contracts/B2BSplitterV13.sol'
      - '.github/workflows/prettier-v13-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Print canonical Prettier diff
        run: |
          bunx prettier contracts/B2BSplitterV13.sol --write
          git diff -- contracts/B2BSplitterV13.sol
          git diff --quiet -- contracts/B2BSplitterV13.sol
