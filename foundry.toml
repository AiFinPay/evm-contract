[profile.default]
src = "contracts"
out = "foundry-artifacts"
test = "foundry-tests"
cache_path = "foundry-cache"

solc_version = "0.8.35"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
via_ir = true

remappings = [
    "forge-std/=lib/forge-std/src/forge-std/src/"
]

# =============================================================================
# LINTER CONFIGURATION
# =============================================================================

[lint]
# Specifies which lints to run based on severity
# If uninformed, all severities are checked
# Options: "high", "medium", "low", "info", "gas", "code-size"
# Default: ["high", "medium", "low"]
severity = ["high", "medium", "low", "info", "gas", "code-size"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
#multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"
single_line_statement_blocks = "preserve"